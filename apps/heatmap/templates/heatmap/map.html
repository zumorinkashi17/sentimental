{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="view-section lg:h-full h-auto flex flex-col p-4 sm:p-8 overflow-y-auto custom-scrollbar">
    <div class="max-w-6xl mx-auto w-full space-y-6">
        <div class="flex flex-col sm:flex-row justify-between sm:items-end gap-3">
            <div>
                <h1 class="text-2xl font-bold text-gray-800">Geographic Risk Heatmap</h1>
                <p class="text-gray-500">Live monitoring of caller regions and risk hotspots.</p>
            </div>
            <div class="flex flex-col sm:flex-row gap-2">
                <select class="form-input bg-white w-full sm:w-auto py-1.5 text-xs text-gray-600 border-gray-200 font-medium shadow-sm">
                    <option>Live Data</option>
                    <option>Past 24 Hours</option>
                    <option>Past Week</option>
                </select>
                <select class="form-input bg-white w-full sm:w-auto py-1.5 text-xs text-gray-600 border-gray-200 font-medium shadow-sm">
                    <option>All Visayas</option>
                    <option>Cebu Province</option>
                </select>
            </div>
        </div>
        
        <!-- Heatmap Map Visualization -->
        <div class="bg-white p-2 rounded-2xl border border-gray-100 shadow-sm h-[420px] sm:h-[600px] flex flex-col relative overflow-hidden">
            <div class="absolute top-3 left-3 sm:top-6 sm:left-6 z-10 bg-white/90 p-2 rounded backdrop-blur shadow border border-gray-100">
                <h2 class="text-xs sm:text-sm font-bold text-gray-700 uppercase">Live Hotspots: Cebu Province</h2>
            </div>
            
            <div class="relative flex-1 w-full rounded-xl overflow-hidden shadow-inner bg-blue-50/50">
                <iframe title="Map of Cebu Province" src="https://www.openstreetmap.org/export/embed.html?bbox=123.80,10.25,124.05,10.40&layer=mapnik" class="absolute inset-0 w-full h-full opacity-60 pointer-events-none" style="border:0;" allowfullscreen="" loading="lazy"></iframe>
                
                <div class="absolute inset-0 bg-brand-light/10 z-0 pointer-events-none"></div>

                <!-- Simulated Hotspots -->
                <!-- Cebu City -->
                <div class="absolute top-[55%] left-[50%] z-10 pointer-events-none" title="Cebu City - High Risk">
                    <span class="absolute inline-flex h-16 w-16 rounded-full bg-red-500 opacity-40 animate-ping -left-5 -top-5"></span>
                    <span class="absolute inline-flex h-10 w-10 rounded-full bg-red-400 opacity-60 -left-2 -top-2"></span>
                    <span class="relative inline-flex rounded-full h-6 w-6 bg-red-600 border-2 border-white shadow-lg flex items-center justify-center text-white text-[8px] font-bold">24</span>
                </div>
                
                <!-- Mandaue City -->
                <div class="absolute top-[35%] left-[62%] z-10 pointer-events-none" title="Mandaue City - High Risk">
                    <span class="absolute inline-flex h-12 w-12 rounded-full bg-red-400 opacity-40 animate-ping -left-4 -top-4" style="animation-delay: 0.3s"></span>
                    <span class="relative inline-flex rounded-full h-5 w-5 bg-red-500 border border-white shadow flex items-center justify-center text-white text-[8px] font-bold">12</span>
                </div>

                <!-- Talisay City -->
                <div class="absolute top-[75%] left-[35%] z-10 pointer-events-none" title="Talisay - Medium Risk">
                    <span class="absolute inline-flex h-10 w-10 rounded-full bg-orange-400 opacity-40 animate-ping -left-3 -top-3" style="animation-delay: 0.8s"></span>
                    <span class="relative inline-flex rounded-full h-4 w-4 bg-orange-500 border border-white shadow flex items-center justify-center text-white text-[8px] font-bold">7</span>
                </div>

                <!-- Legend -->
                <div class="absolute bottom-2 right-2 sm:bottom-4 sm:right-4 bg-white/95 backdrop-blur p-2 sm:p-3 rounded-lg shadow-md border border-gray-100 text-[10px] sm:text-xs font-bold text-gray-600 flex flex-col gap-1.5 sm:gap-2 z-20">
                    <span class="text-[9px] sm:text-[10px] text-gray-400 uppercase tracking-wide mb-1 border-b border-gray-100 pb-1">Concentration Level</span>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-red-600 rounded-full shadow flex-shrink-0"></div> High (&gt;10 Calls)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-orange-500 rounded-full shadow flex-shrink-0"></div> Medium (5-10 Calls)</div>
                    <div class="flex items-center gap-2"><div class="w-3 h-3 bg-yellow-400 rounded-full shadow flex-shrink-0"></div> Low (&lt;5 Calls)</div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
