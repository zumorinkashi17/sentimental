{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sentimental - Forgot Password</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: { extend: { colors: { brand: { light: '#e6f7f4', DEFAULT: '#00a67e', dark: '#007a5d' } } } }
        }
    </script>
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        .form-input { width: 100%; border: 1px solid #e2e8f0; border-radius: 0.375rem; padding: 0.5rem 0.75rem; font-size: 0.875rem; color: #334155; transition: all 0.2s; }
        .form-input:focus { outline: none; border-color: #00a67e; box-shadow: 0 0 0 2px rgba(0, 166, 126, 0.1); }
        .form-label { display: block; font-size: 0.7rem; font-weight: 600; color: #475569; margin-bottom: 0.25rem; text-transform: uppercase; }
    </style>
</head>
<body class="bg-gradient-to-br from-brand-light to-white min-h-screen flex items-center justify-center p-4">
    <div class="bg-white p-8 rounded-3xl shadow-xl border border-brand/10 w-full max-w-md">
        <div class="mb-6 flex justify-center">
            <img src="{% static 'images/Sentimental-logo.png' %}" alt="Sentimental" class="w-12 h-12 object-contain mx-auto">
        </div>
        <h1 class="text-2xl font-bold text-gray-800 mb-1 text-center">Forgot Password?</h1>
        <p class="text-sm text-gray-500 mb-6 text-center">Enter your email address and we'll send you a link to reset your password.</p>
        
        <form id="reset-request-form" class="space-y-4">
            {% csrf_token %}
            <div>
                <label class="form-label" for="reset-email">Email Address</label>
                <input id="reset-email" type="email" name="email" class="form-input" placeholder="user@tawagpaglaum.org" required>
            </div>
            <button type="submit" class="w-full bg-brand text-white font-bold py-3 rounded-lg hover:bg-brand-dark transition-colors shadow-md">
                Send Reset Link
            </button>
            <div class="text-center mt-4">
                <a href="{% url 'accounts:login' %}" class="text-sm text-brand font-semibold hover:underline">Back to Login</a>
            </div>
        </form>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <script>
        // Consistent CenterAlert Mixin
        const CenterAlert = Swal.mixin({
            showConfirmButton: false,
            timer: 3000,
            timerProgressBar: true,
            width: '24rem',
            padding: '1.5rem',
            customClass: {
                popup: 'rounded-2xl shadow-xl border border-gray-100 text-sm',
                title: 'text-gray-800 font-semibold text-base m-0',
                icon: 'text-brand' 
            },
            didOpen: (popup) => {
                popup.addEventListener('mouseenter', Swal.stopTimer)
                popup.addEventListener('mouseleave', Swal.resumeTimer)
            }
        });

        document.getElementById('reset-request-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const btn = this.querySelector('button[type="submit"]');
            const originalText = btn.textContent;
            btn.textContent = 'Sending...';
            btn.disabled = true;

            fetch('{% url "accounts:password_reset" %}', {
                method: 'POST',
                body: new FormData(this),
                headers: { 'X-Requested-With': 'XMLHttpRequest' }
            })
            .then(r => r.json())
            .then(data => {
                CenterAlert.fire({
                    icon: 'success',
                    title: 'Check your email',
                    text: data.message
                }).then(() => {
                    window.location.href = '{% url "accounts:login" %}';
                });
            })
            .catch(() => {
                CenterAlert.fire({ icon: 'error', title: 'Something went wrong.' });
            })
            .finally(() => { btn.textContent = originalText; btn.disabled = false; });
        });
    </script>
</body>
</html>
